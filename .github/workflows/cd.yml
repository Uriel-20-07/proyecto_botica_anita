name: Despliegue de Spring Boot a Azure

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Configurar Java
        uses: actions/setup-java@v4 # Actualizado a v4
        with:
          java-version: '21' 
          distribution: 'temurin'

      - name: Compilar con Maven
        working-directory: ./backend 
        run: mvn clean package -DskipTests

      - name: Desplegar a Azure Web App
        uses: azure/webapps-deploy@v3 # Actualizado a v3
        with:
          app-name: 'farma-back' # <--- CAMBIADO AQUÍ
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/target/*.jar
