<div id="heroCarousel" class="carousel slide mb-4" data-bs-ride="carousel" data-bs-interval="4000">

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"
            style="background-color:#0056B3;"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"
            style="background-color:#0056B3;"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"
            style="background-color:#0056B3;"></button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="/cuidate.png" class="d-block w-100" alt="Banner Cuidate" />
        </div>

        <div class="carousel-item">
            <img src="/carruOfer.png" class="d-block w-100" alt="Banner Ofertas" />
        </div>

        <div class="carousel-item">
            <img src="/merecesMejor.jpeg" class="d-block w-100" alt="Banner Mereces Mejor" />
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>
