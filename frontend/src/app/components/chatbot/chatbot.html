<!-- Chatbot Floating Action Button -->
<div class="chatbot-fab" (click)="toggleChat()" [class.active]="isOpen">
  <i class="bi bi-chat-dots-fill" *ngIf="!isOpen" style="font-size:26px"></i>
  <i class="bi bi-x-lg" *ngIf="isOpen" style="font-size:26px"></i>
</div>

<!-- Chatbot Window -->
<div class="chatbot-window" [class.open]="isOpen">
  <!-- Header -->
  <div class="chatbot-header">
    <div class="chatbot-header-info">
      <div class="chatbot-avatar-header">
        <img src="logo-perfilchat.png" alt="SofIA" class="chatbot-avatar-img" />
      </div>
      <div>
        <h4 class="chatbot-title">SofIA</h4>
        <span class="chatbot-status">Asistente virtual de BoticaAnita</span>
      </div>
    </div>
    <button type="button" class="chatbot-close-btn" (click)="toggleChat()">✕</button>
  </div>

  <!-- Messages List -->
  <div class="chatbot-messages" #scrollContainer>
    <div class="chatbot-message-wrapper" *ngFor="let msg of messages" [class.user]="msg.role === 'user'" [class.model]="msg.role === 'model'">
      <div class="chatbot-avatar-msg" *ngIf="msg.role === 'model'">
        <img src="logo-perfilchat.png" alt="FC" class="chatbot-avatar-img" />
      </div>
      <div class="chatbot-message-bubble">
        <p class="chatbot-message-text" [innerHTML]="msg.content"></p>

        <!-- Acciones de confirmación (cantidad alternativa ofrecida por el backend) -->
        <div class="chatbot-confirm-actions" *ngIf="msg.confirmacion">
          <button
            type="button"
            class="chatbot-confirm-btn chatbot-confirm-yes"
            (click)="confirmarCantidad(msg)">
            Sí, agregar {{ msg.confirmacion.cantidad }}
          </button>
          <button
            type="button"
            class="chatbot-confirm-btn chatbot-confirm-no"
            (click)="cancelarConfirmacion(msg)">
            No, gracias
          </button>
        </div>
      </div>
    </div>

    <!-- Typing Loader -->
    <div class="chatbot-message-wrapper model" *ngIf="isLoading">
      <div class="chatbot-avatar-msg">
        <img src="logo-perfilchat.png" alt="FC" class="chatbot-avatar-img" />
      </div>
      <div class="chatbot-message-bubble typing-bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- Input Form -->
  <form class="chatbot-input-form" (submit)="sendMessage($event)">
    <input type="text" name="userInput" [(ngModel)]="userInput" class="chatbot-input" placeholder="Pregunta sobre medicamentos..." autocomplete="off" />
    <button type="submit" class="chatbot-send-btn" [disabled]="!userInput.trim() || isLoading">
      <i class="bi bi-send-fill" style="font-size:18px"></i>
    </button>
  </form>
</div>
